<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Responsive QA — Career Intelligence BD</title><style>body{margin:16px;font:16px sans-serif;background:#ddd}button{padding:10px;margin:4px}iframe{display:block;border:1px solid #777;background:white;height:760px;max-width:100%}</style><h1>Responsive QA</h1><p>Development-only frame. Tests CSS viewport reflow; does not emulate a mobile device.</p><div id="sizes"><button data-width="320">320 px</button><button data-width="375">375 px</button><button data-width="768">768 px</button><button data-width="1280">1280 px</button></div><label>Page <select id="view"><option value="overview">Overview</option><option value="skills">Skills</option><option value="learning">Learning</option><option value="tools">Tools</option><option value="jobs">Work data</option><option value="business">Business</option><option value="methodology">Methodology</option></select></label><iframe title="Dashboard responsive test" id="preview" src="index.html" style="width:375px"></iframe><script>const frame=document.getElementById('preview');document.getElementById('sizes').addEventListener('click',e=>{if(e.target.dataset.width)frame.style.width=e.target.dataset.width+'px'});document.getElementById('view').addEventListener('change',e=>frame.src='index.html#'+e.target.value);</script></html>
