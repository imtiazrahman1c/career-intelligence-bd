name: Manual aggregate collection probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Fetch public source
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$REVISION"
          git checkout --detach FETCH_HEAD
      - name: Collect and validate aggregate data
        run: python3 -m collectors.refresh_snapshot --output "$RUNNER_TEMP/aggregate-snapshot.json"
      - name: Report scope
        run: echo 'Validated bounded collection only. No database publication, raw archive or schedule.' >> "$GITHUB_STEP_SUMMARY"
